<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Outer ambient aura glow -->
    <radialGradient id="orbAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#8A3FFC" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8A3FFC" stop-opacity="0"/>
    </radialGradient>

    <!-- Main Voice Orb Radial Gradient (Cyan -> Indigo -> Purple) -->
    <radialGradient id="orbGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38D9FF"/>
      <stop offset="35%" stop-color="#467BFF"/>
      <stop offset="70%" stop-color="#8B4DFF"/>
      <stop offset="92%" stop-color="#C55CFF"/>
      <stop offset="100%" stop-color="#A830E8"/>
    </radialGradient>

    <!-- Specular rim highlight -->
    <linearGradient id="orbRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="12" cy="12" r="11.5" fill="url(#orbAura)"/>

  <!-- Main Orb Sphere -->
  <circle cx="12" cy="12" r="9.5" fill="url(#orbGrad)"/>

  <!-- Specular Rim -->
  <circle cx="12" cy="12" r="9.0" stroke="url(#orbRimGrad)" stroke-width="0.75"/>

  <!-- Center Waveform Bars (5 rounded capsules) -->
  <rect x="6.5" y="10.2" width="1.4" height="3.6" rx="0.7" fill="#FFFFFF"/>
  <rect x="8.9" y="8.0" width="1.4" height="8.0" rx="0.7" fill="#FFFFFF"/>
  <rect x="11.3" y="6.2" width="1.4" height="11.6" rx="0.7" fill="#FFFFFF"/>
  <rect x="13.7" y="8.0" width="1.4" height="8.0" rx="0.7" fill="#FFFFFF"/>
  <rect x="16.1" y="10.2" width="1.4" height="3.6" rx="0.7" fill="#FFFFFF"/>
</svg>
