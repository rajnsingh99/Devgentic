# ⚠️ The `version` id is pre-filled by the app (`GitHubIssueLink`); keep it stable.
name: Feature request
description: Suggest an idea or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you've tried
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Chat / agent
        - Code mode
        - Workflows
        - Models (MLX / Ollama / cloud)
        - Tools / MCP
        - ChatOps (Telegram / Discord / Slack)
        - Voice (dictation / Orb)
        - Quick Access
        - Settings / setup
        - Other
  - type: input
    id: version
    attributes:
      label: Devgentic version
      description: Filled in automatically when requested from the app.
